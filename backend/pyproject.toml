[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-clipforge"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "streamlink>=8.6,<9", "yt-dlp[default]>=2026.1", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
